<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sliding Download Button</title>
    <link rel="stylesheet" href="button.css" />
</head>
<body>
    <a class="cta-button" href="files/Gabriel_Stewart_CV.pdf" download="Gabriel_Stewart_CV.pdf" aria-label="Download CV">
        <span class="label-dark" aria-hidden="true">Download CV</span>
        <span class="label-light" aria-hidden="true">Download CV</span>
        <span class="slider" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14" />
            </svg>
        </span>
    </a>
</body>
</html>
